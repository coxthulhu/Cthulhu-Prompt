name: Publish Windows Release

# Release tags pushed from main (vX.Y.0) or release/X.Y branches (vX.Y.Z) build and publish themselves.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Setup npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build and upload to a draft release (Windows)
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --publish=always
      - name: Publish release with changelog notes
        shell: bash
        run: node scripts/publish-release.mjs "$GITHUB_REF_NAME" coxthulhu/Cthulhu-Prompt
