name: Publish Windows Release

# Release tags pushed from main (vX.Y.0) or release/X.Y branches (vX.Y.Z) build and publish themselves.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Setup npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # electron-builder can start two GitHub publishers that each create a draft when none exists,
      # splitting the uploads between them. An existing draft gives every upload one release to find.
      - name: Create the draft release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
      - name: Build and upload to a draft release (Windows)
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --publish=always
      - name: Publish release with changelog notes
        shell: bash
        run: node scripts/publish-release.mjs "$GITHUB_REF_NAME" coxthulhu/Cthulhu-Prompt
